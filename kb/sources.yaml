    verification: primary_extracted
    file: "English translation, 29 pages, sha256 d5d5f9e93bd6c0dc2afe79776f3101bcd599e4400a67309bc0b378b2812bcf3a (kb/build/fetch_manifest.json)"
    notes: "18 verbatim clauses machine-cut from the official file on 24 Oct 2026 (kb/curated/clauses.yaml; kb/extract_clauses.py --check passes). Art. 2(2)(a)-(b) excludes government data and governmental entities that control or process personal data (p. 6), as the secondary sources said. Art. 18 (p. 21-22) is a right to object to decisions from automated processing, with exceptions in 18(2) and human review on request in 18(4). 'Government Data' is not defined in Art. 1 of this file. Two-person check pending (docs/T06_PDPL_CLAUSES.md)."

