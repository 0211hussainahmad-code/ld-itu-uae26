[pytest]
# Public export only (see README.md §5 and PUBLIC_EXPORT_MANIFEST.json). The private repository runs its full suite without this file.
testpaths = tests web/tests
# These two tests compare the live profile word for word with the frozen benchmark case file
# eval/bakeoff_cases.yaml, which is not exported (it quotes ITU-T Y.3172). They pass in the private repository.
addopts =
    --deselect tests/test_demonstration.py::test_live_profile_is_frozen_benchmark_config_a_word_for_word
    --deselect tests/test_demonstration.py::test_openrouter_profile_is_frozen_config_a_exactly_with_its_groq_pin
# These three tests read files of the private website pipeline that are not exported (internal deployment
# plan web/deploy/, branch-only workflow .github/workflows/web.yml, pipeline intent files web/requests/).
    --deselect web/tests/test_web_preview.py::test_the_plan_pins_the_values_of_the_frozen_build
    --deselect web/tests/test_web_publication.py::test_workflow_references_no_secrets_and_has_no_deploy_job
    --deselect web/tests/test_web_publication.py::test_request_files_are_validated_strictly
