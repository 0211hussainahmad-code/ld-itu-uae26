  - {id: Q04, author: claude-draft, q: "Which pipeline node sends model output to the sink nodes?", expect: [itu-t-y3172-2019], must_contain: "distributing the output"}
  - {id: Q05, author: claude-draft, q: "What is the preprocessor node responsible for?", expect: [itu-t-y3172-2019], must_contain: "cleaning data"}
  - {id: Q06, author: claude-draft, q: "What is a SINK in an ML pipeline?", expect: [itu-t-y3172-2019], must_contain: "target of the ML output"}
