# LinkDown source register (G0-E). One entry per document.
#
# verification:
#   primary_verified  - we opened the primary text and checked the clause we rely on
#   primary_extracted - verbatim clauses machine-cut from the official file are in the KB
#                       (kb/curated/clauses.yaml); the two-person check is still pending
#   primary_partial   - primary text opened, but the clause we need is not yet located
#   official_summary  - an official government page summarises it; full text not checked
#   secondary_only    - only law-firm or press summaries so far
#   pending           - identified, not yet opened
# The gate (config/rules.yaml) only hard-prohibits on primary_verified clauses.
# url_checked: false marks links we have not opened ourselves yet.
#
# licence: "link_and_excerpt" means no redistribution licence was found; the public
# knowledge base stores the URL, metadata and short excerpts, not the full file.
version: sources-0.2
checked_on: 2026-10-24

