# Default-deny licence register for PUBLIC website output (plan rev 2.1, section 6).
#
# Every source in kb/sources.yaml must have an entry; a missing source blocks the build.
# publish: metadata_only     -> only id, title, issuer, date, URL, verification status may appear publicly.
# publish: approved_excerpts -> additionally the excerpt ids listed under approved_excerpts, each with a
#                               named human approver, date and reason. Length never grants permission.
# ITU documents stay metadata_only for Phase 1. The shingle scanner is defence in depth, not permission.
# Changing any entry from metadata_only requires an explicit team approval recorded here.
