# Retrieval check (revision-pack target: at least 27 of 30 answered by a top-3 chunk).
#
# A question passes when one of the top-3 chunks comes from an expected source
# AND contains the must_contain text (case-insensitive), if one is given.
#
# Honest limitation: these 30 were drafted by the same author as kb/notes.yaml,
# so word overlap makes them easier than real questions. Before we quote the
# score, each team member writes 10 more questions WITHOUT looking at the notes
# (set author: team-blind) and we report both scores separately.
version: rq-0.1
questions:
